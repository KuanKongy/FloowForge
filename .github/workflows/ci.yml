name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: api/requirements.txt
      - name: Install
        working-directory: api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff
      - name: Lint
        working-directory: api
        run: ruff check .
      - name: Test (3 iterations)
        working-directory: ${{ github.workspace }}
        run: PYTHONPATH=. pytest api/tests -q --count=3

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        # `npm ci` installs exactly what the lockfile pins, so CI builds what
        # production builds. `npm install` silently resolved fresh minors.
        run: npm ci --no-audit --no-fund
      - name: Lint
        working-directory: web
        run: npm run lint --if-present
      - name: Typecheck
        working-directory: web
        run: npx tsc --noEmit
      - name: Unit tests (3 iterations)
        working-directory: web
        run: |
          for i in 1 2 3; do echo "Run $i"; npm test --silent; done
      - name: Build
        working-directory: web
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy
          NEXT_PUBLIC_API_URL: http://localhost:5001
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f Dockerfile.api -t flowforge-api:ci .
      - name: Build worker image
        run: docker build -f Dockerfile.worker -t flowforge-worker:ci .

  e2e:
    runs-on: ubuntu-latest
    # The Playwright specs need a running stack and real Supabase credentials,
    # so they only run when those secrets are configured. They self-skip
    # without E2E_BASE_URL, which previously meant the whole suite silently
    # never ran anywhere.
    if: ${{ github.event_name == 'push' }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Install Playwright browsers
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Run e2e
        working-directory: web
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: |
          if [ -z "$E2E_BASE_URL" ]; then
            echo "::warning::E2E_BASE_URL not configured — Playwright specs skipped."
            exit 0
          fi
          npm run e2e:ci
