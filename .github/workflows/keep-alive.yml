name: Keep Alive

# Supabase pauses free-tier projects after ~7 days without traffic, and a
# paused project takes manual restoring plus a cold start before schedules and
# webhooks work again. A daily ping keeps the counter from ever reaching that
# threshold.
#
# Note: GitHub disables `schedule` triggers on repos with no commits for 60
# days and emails the owner. If that happens, re-enable the workflow from the
# Actions tab (or run it once via `workflow_dispatch`).
on:
  schedule:
    # 04:17 UTC daily — off the hour, because top-of-hour cron slots queue
    # longest on shared runners.
    - cron: "17 4 * * *"
  workflow_dispatch:

concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping API health
        env:
          KEEPALIVE_API_URL: ${{ secrets.KEEPALIVE_API_URL }}
        run: |
          set -euo pipefail
          if [ -z "${KEEPALIVE_API_URL:-}" ]; then
            echo "::error::KEEPALIVE_API_URL secret is not set — nothing was pinged."
            exit 1
          fi
          url="${KEEPALIVE_API_URL%/}/health"
          echo "GET $url"
          # --retry covers a cold container that needs a moment to boot; a
          # single timeout should not page anyone.
          code=$(curl -sS -o /tmp/health.json -w '%{http_code}' \
            --max-time 30 --retry 3 --retry-delay 10 --retry-all-errors \
            "$url")
          echo "HTTP $code"
          cat /tmp/health.json || true
          echo
          if [ "$code" != "200" ]; then
            echo "::error::Health check returned HTTP $code."
            exit 1
          fi

      - name: Ping Supabase REST
        # `/health` answers from the API process alone and never opens a
        # database connection, so on its own it does not count as Supabase
        # activity. This request goes through PostgREST to Postgres, which is
        # the traffic that actually holds off the pause. RLS makes the anon
        # read return an empty set; reaching the database is the point, not the
        # rows.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "::error::SUPABASE_URL / SUPABASE_ANON_KEY secrets are not set — the database was not touched."
            exit 1
          fi
          url="${SUPABASE_URL%/}/rest/v1/profiles?select=id&limit=1"
          echo "GET ${SUPABASE_URL%/}/rest/v1/profiles?select=id&limit=1"
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            --max-time 30 --retry 3 --retry-delay 10 --retry-all-errors \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$url")
          echo "HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::Supabase REST ping returned HTTP $code."
            exit 1
          fi
