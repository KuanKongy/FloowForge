# One command for the whole stack: docker compose up --build
#
# Postgres/Auth/Storage/Realtime come from hosted Supabase, so two env files
# feed this stack:
#   - api/.env — backend secrets (Supabase keys, provider keys); see api/.env.example
#   - .env     — root file with the browser-side build args; see .env.example
#
# Do NOT scale `api` beyond 1 replica: the schedule runner (APScheduler) lives
# in the API process, so replicas would fire every schedule once each.

# Explicit project name so container/volume names don't depend on the checkout
# folder's name.
name: floowforge

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "5001:5001"
    env_file: api/.env
    environment:
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development
      WEB_ORIGIN: http://localhost:3000
      PUBLIC_API_URL: http://localhost:5001
      # No proxy sits in front of the container, so only loopback may rewrite
      # the client address from X-Forwarded-For; the socket peer stays
      # authoritative for rate limiting.
      FORWARDED_ALLOW_IPS: 127.0.0.1
    depends_on:
      # Without a healthy Redis the API silently degrades to inline runs and
      # per-process rate limits, so wait for it.
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file: api/.env
    environment:
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development
      WEB_ORIGIN: http://localhost:3000
      PUBLIC_API_URL: http://localhost:5001
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        # The browser (not the container) calls the API, so this must be the
        # host-published URL — never http://api:5001.
        NEXT_PUBLIC_API_URL: http://localhost:5001
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  redis-data:
